name: build

on:
  push:
    branches: [ main ]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  platformio:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Static validation
        run: python scripts/validate_project.py

      - name: Internal regression tests
        run: python tests/internal_tests.py

      - name: Build firmware
        run: pio run -e d1_mini

      - name: Create OTA package
        run: python scripts/make_ota.py

      - name: Verify firmware package
        run: |
          test -f ota-dist/firmware.bin
          test -f ota-dist/firmware.bin.sha256
          test -f ota-dist/manifest.json
          test -f ota-dist/README.md
          ls -lh ota-dist/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp8266-moisture-sensor-v0.1.23
          path: |
            ota-dist/firmware.bin
            ota-dist/firmware.bin.sha256
            ota-dist/manifest.json
            ota-dist/README.md
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "ESP8266 Moisture Sensor $GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md
          fi

      - name: Upload firmware to GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            ota-dist/firmware.bin \
            ota-dist/firmware.bin.sha256 \
            ota-dist/manifest.json \
            ota-dist/README.md \
            --clobber
